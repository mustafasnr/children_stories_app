name: children_stories
description: "Children Stories - A premium children's books & audio stories app"
publish_to: 'none'

version: 1.0.4+5

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  supabase_flutter: ^2.12.4
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.0.0
  crypto: ^3.0.7
  adapty_flutter: ^3.15.5
  go_router: ^17.2.3
  just_audio: ^0.10.5
  audio_session: ^0.2.3
  google_fonts: ^8.1.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.3.0
  phosphor_flutter: ^2.1.0
  country_flags: ^1.1.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  package_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/categories/